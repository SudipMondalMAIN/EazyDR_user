name: EazyDoctor
description: EazyDoctor patient app — book doctors, pharmacies and nursing homes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  go_router: ^14.2.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.2.3
  package_info_plus: ^8.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.1
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true